name: Build & Test (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: SwiftPM Build & Package Verification
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Swift & OS Version
        run: |
          sw_vers
          swift --version

      - name: Build Debug Binary
        run: swift build -v

      - name: Build Release Binary
        run: swift build -c release

      - name: Set up Python for DMG Asset Generator
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow & Test DMG Generator
        run: |
          pip install pillow
          python3 scripts/generate_dmg_bg.py
